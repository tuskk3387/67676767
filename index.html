<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>67</title>

    <style>
        body{
            margin: 0;
            overflow: hidden;
        }

        img{
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        button{
            position: fixed;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
        }

        .spin-scale{
            animation: spin-scale 1.165s linear infinite;
        }

        @keyframes spin-scale{
            0%{
                transform: translate(-50%, -50%) rotate(0deg) scale(0.5);
            }

            50%{
                transform: translate(-50%, -50%) rotate(15deg) scale(1);
            }
            51%{
                transform: translate(-50%, -50%) rotate(0deg) scale(0.5);
            }

            100%{
                transform: translate(-50%, -50%) rotate(-15deg) scale(1);
            }
        }
    </style>
</head>
<body>

    <img id="gif67" src="bosnov-67.gif" alt="67">

    <button onclick="playSong()">67</button>

    <audio id="myAudio" src="eyyyyyyy-six-seven.mp3" loop></audio>

    <script>
        const track = document.getElementById("myAudio");
        const img = document.getElementById("gif67");

        function playSong() {
            track.play();

            if (!img.classList.contains("spin-scale")) {
                img.classList.add("spin-scale");
                img.src = "scp-067-67.gif"
            }
        }
    </script>

</body>
</html>
